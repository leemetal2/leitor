<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrimônio - Controle de Materiais</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#E65100">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimonio">
<style>

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff;
  font-family: Inter, Arial, sans-serif;
  color: #1f2937;
  text-align: center;
  padding: 24px;
  box-sizing: border-box;
}

img {
  width: 140px;
  height: 140px;
  border-radius: 30px;
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
}

h1 {
  font-size: 20px;
  margin: 18px 0 4px;
  color: #F57C00;
}

p {
  margin: 4px 0;
  color: #6b7280;
  font-size: 14px;
  max-width: 320px;
}

a.btn, button {
  display: inline-block;
  margin-top: 18px;
  background: #F57C00;
  color: #fff;
  border: 0;
  border-radius: 10px;
  padding: 13px 26px;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

button.sec {
  background: #fff;
  color: #F57C00;
  border: 2px solid #F57C00;
  margin-top: 10px;
}

#dica {
  display: none;
  margin-top: 16px;
  font-size: 13px;
  color: #6b7280;
  max-width: 320px;
}

</style>
<script>
var URL_SISTEMA="https://script.google.com/macros/s/AKfycbxwdtAE3WSXqzUcRE6XygCzLE7h_l3sty8FEZvZXGgEFOnLBTGto3knuC18CNm38k8E5A/exec";
var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true||/[?&]app=1/.test(location.search);
if(standalone){location.replace(URL_SISTEMA);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;var b=document.getElementById('bInst');if(b)b.style.display='inline-block';});
window.addEventListener('appinstalled',function(){var b=document.getElementById('bInst');if(b)b.style.display='none';});
function instalar(){if(dp){dp.prompt();dp=null;}}
window.addEventListener('load',function(){
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 var d=document.getElementById('dica');d.style.display='block';
 d.textContent=ios?'Para instalar: toque em Compartilhar e depois em "Adicionar à Tela de Início".':'Para instalar: toque em Instalar aqui em cima ou no menu ⋮ do Chrome e escolha "Instalar aplicativo".';
});
</script>
</head><body>
<img src="icon-192.png" alt="Colefar">
<h1>Patrimônio</h1>
<p>Controle de Materiais</p>
<a class="btn" href="https://script.google.com/macros/s/AKfycbxwdtAE3WSXqzUcRE6XygCzLE7h_l3sty8FEZvZXGgEFOnLBTGto3knuC18CNm38k8E5A/exec">Abrir sistema</a>
<button id="bInst" class="sec" style="display:none" onclick="instalar()">Instalar aplicativo</button>
<div id="dica"></div>
</body></html>
